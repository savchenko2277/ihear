<header class="header @@if(this.mod){header_@@mod}">
	<div class="header__wrap">
		<div class="header__top">
			<div class="container header__top-inner">
				<p class="header__top-item">
					<svg class="header__top-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
						<path d="M12 21s7-5.1 7-11a7 7 0 1 0-14 0c0 5.9 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/>
						<circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.8"/>
					</svg>
					<span>Москва, Малый Путинковский пер., 1/2 стр 1</span>
				</p>
				<p class="header__top-item">
					<svg class="header__top-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
						<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
						<path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
					<span>Пн–Пт 10:00–19:00, выходные по записи</span>
				</p>
			</div>
		</div>

		<div class="header__main">
			<div class="container header__inner">
				<a class="header__logo" href="/">
					<img src="img/logo/logo.webp" alt="Я Слышу!" width="162" height="31" loading="eager">
					<span class="header__logo-desc">Слуховые аппараты в&nbsp;Москве</span>
				</a>

				<nav class="header__nav" aria-label="Основная навигация">
					<a class="header__link" href="/o-nas/">О компании</a>
					<a class="header__link" href="/catalog/">Каталог</a>
					<a class="header__link" href="/uslugi/">Услуги</a>
					<a class="header__link" href="/price/">Прайс-лист</a>
					<a class="header__link" href="/novosti/">Новости</a>
					<a class="header__link" href="/kontakty/">Контакты</a>
				</nav>

				<div class="header__actions">
					<a class="header__phone" href="tel:+74956423970">+7 (495) 642-39-70</a>
					<button class="btn header__cta" type="button" data-modal="#callback">Перезвоните мне</button>
				</div>

				<button class="header__burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-menu">
					<span></span>
					<span></span>
					<span></span>
				</button>
			</div>
		</div>
	</div>

	<div class="header__mobile" id="mobile-menu">
		<button class="header__mobile-close" type="button" aria-label="Закрыть меню"></button>
		<nav class="header__mobile-nav" aria-label="Мобильная навигация"></nav>
		<div class="header__mobile-bottom"></div>
	</div>
</header>
